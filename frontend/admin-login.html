<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login — Cashio Security</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #060e1d; padding: 20px;">

  <div style="background: #ffffff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 420px; overflow: hidden; border: 2px solid #D4AF37;">
    
    <div style="background: #0A1931; padding: 28px 24px 20px; text-align: center; border-bottom: 2px solid #D4AF37;">
      <a href="index.html">
        <img src="assets/logo.png" alt="Cashio Security" style="height: 46px; margin-bottom: 8px;">
      </a>
      <div style="display: inline-block; background: rgba(212, 175, 55, 0.2); color: var(--gold-light); font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; letter-spacing: 0.08em; text-transform: uppercase;">
        🛡️ Bank Supervisory Portal
      </div>
    </div>

    <div style="padding: 32px 28px;">
      
      <div id="admin-login-alert" style="display: none; padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px;"></div>

      <form id="admin-login-form">
        
        <div class="form-group">
          <label class="form-label" for="admin-password">Master Admin Password</label>
          <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required autofocus />
          <div class="form-hint">Default seeded: <code>Admin@1234</code></div>
        </div>

        <button type="submit" id="admin-submit-btn" class="btn btn-gold btn-block" style="padding: 13px; font-weight: 700; margin-top: 10px;">
          Authenticate as Administrator
        </button>

      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.85rem;">
        <a href="login.html" style="color: #64748b;">&larr; Back to Customer Online Banking</a>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const form = document.getElementById("admin-login-form");
    const alertEl = document.getElementById("admin-login-alert");
    const submitBtn = document.getElementById("admin-submit-btn");

    form.onsubmit = async (e) => {
      e.preventDefault();
      alertEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Verifying Credentials...';

      const password = document.getElementById("admin-password").value;

      try {
        const data = await api.post("/admin/login", { password });
        auth.saveAdminSession(data.access_token);
        ui.toast("Admin authentication successful!", "success");
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 500);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Authenticate as Administrator';

        alertEl.style.display = "block";
        alertEl.style.background = "#fee2e2";
        alertEl.style.color = "#b91c1c";
        alertEl.textContent = err.message || "Invalid administrator credentials.";
      }
    };
  </script>
</body>
</html>
