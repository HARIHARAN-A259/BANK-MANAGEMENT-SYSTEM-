<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Portal — Cashio Security</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .admin-tab.active {
      color: #0A1931;
      border-bottom: 2px solid #D4AF37;
      font-weight: 700;
    }
  </style>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #060e1d; padding: 20px;">

  <div style="background: #ffffff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 440px; overflow: hidden; border: 2px solid #D4AF37;">
    
    <div style="background: #0A1931; padding: 28px 24px 20px; text-align: center; border-bottom: 2px solid #D4AF37;">
      <a href="index.html">
        <img src="assets/logo.png" alt="Cashio Security" style="height: 46px; margin-bottom: 8px;">
      </a>
      <div style="display: inline-block; background: rgba(212, 175, 55, 0.2); color: var(--gold-light); font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; letter-spacing: 0.08em; text-transform: uppercase;">
        🛡️ Bank Supervisory Portal
      </div>
    </div>

    <!-- Mode Selector Tabs -->
    <div style="display: flex; border-bottom: 1px solid #e2e8f0; background: #f8fafc;">
      <div id="tab-login" class="admin-tab active" onclick="setMode('login')">Sign In</div>
      <div id="tab-register" class="admin-tab" onclick="setMode('register')">Create Admin ID</div>
    </div>

    <div style="padding: 28px 28px 32px;">
      
      <div id="admin-status-note" style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 16px; background: #fef9c3; color: #854d0e; border: 1px solid #fde047;">
        ⚡ <strong>First-Time Setup:</strong> No admin account exists in database. Create your master admin ID below.
      </div>

      <div id="admin-alert" style="display: none; padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px;"></div>

      <form id="admin-form">
        
        <div class="form-group">
          <label class="form-label" for="admin-username">Admin ID / Username</label>
          <input type="text" id="admin-username" class="form-control" placeholder="e.g. admin or your username" required autofocus />
          <div class="form-hint" id="admin-username-hint">3–30 alphanumeric characters</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Admin Password</label>
          <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required />
          <div class="form-hint" id="admin-password-hint">8+ chars, upper, lower, digit and special char (!@#$%)</div>
        </div>

        <button type="submit" id="admin-submit-btn" class="btn btn-gold btn-block" style="padding: 13px; font-weight: 700; margin-top: 14px;">
          Sign In as Administrator
        </button>

      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.85rem;">
        <a href="login.html" style="color: #64748b;">&larr; Back to Customer Online Banking</a>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let currentMode = "login";
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const form = document.getElementById("admin-form");
    const alertEl = document.getElementById("admin-alert");
    const statusNote = document.getElementById("admin-status-note");
    const submitBtn = document.getElementById("admin-submit-btn");
    const usernameInput = document.getElementById("admin-username");
    const passwordInput = document.getElementById("admin-password");

    function setMode(mode) {
      currentMode = mode;
      alertEl.style.display = "none";
      if (mode === "login") {
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        submitBtn.textContent = "Sign In as Administrator";
        document.getElementById("admin-username-hint").textContent = "Your admin username or ID";
      } else {
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        submitBtn.textContent = "Create New Admin ID";
        document.getElementById("admin-username-hint").textContent = "3–30 alphanumeric characters";
      }
    }

    // Check if admin is already configured on load
    async function checkAdminStatus() {
      try {
        const res = await api.get("/admin/status");
        if (!res.configured) {
          statusNote.style.display = "block";
          setMode("register");
        }
      } catch (e) {
        // Ignore if error
      }
    }
    checkAdminStatus();

    form.onsubmit = async (e) => {
      e.preventDefault();
      alertEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Processing...';

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      try {
        let endpoint = currentMode === "register" ? "/admin/register" : "/admin/login";
        const data = await api.post(endpoint, { username, password });
        
        auth.saveAdminSession(data.access_token);
        ui.toast(data.message || "Admin authentication successful!", "success");
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 500);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = currentMode === "register" ? "Create New Admin ID" : "Sign In as Administrator";

        alertEl.style.display = "block";
        alertEl.style.background = "#fee2e2";
        alertEl.style.color = "#b91c1c";
        alertEl.textContent = err.message || "Failed to authenticate administrator.";
      }
    };
  </script>
</body>
</html>
