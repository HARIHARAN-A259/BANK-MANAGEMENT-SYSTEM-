<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — Cashio Security</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0A1931 0%, #102444 100%); padding: 20px;">

  <div style="background: #ffffff; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 440px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.3);">
    
    <!-- Header -->
    <div style="background: #0A1931; padding: 28px 24px 20px; text-align: center; border-bottom: 2px solid #D4AF37;">
      <a href="index.html">
        <img src="assets/logo.png" alt="Cashio Security" style="height: 48px; margin-bottom: 8px;">
      </a>
      <p style="color: #cbd5e1; font-size: 0.88rem;">Customer Online Banking Sign-In</p>
    </div>

    <!-- Form Area -->
    <div style="padding: 32px 28px;">
      
      <!-- Alert Banner -->
      <div id="login-alert" style="display: none; padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px;"></div>

      <form id="login-form">
        
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. HARIHARAN A" required autofocus />
          <div class="form-hint">Enter your registered username</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
          <div class="form-hint">8+ characters with upper, lower, digit & special</div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 10px;">
          <span>Sign In to Cashio Security</span>
        </button>

      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.88rem; color: #64748b;">
        Don't have an account yet? <a href="register.html" style="font-weight: 700;">Open an Account</a>
      </div>

      <div style="margin-top: 14px; text-align: center; font-size: 0.8rem;">
        <a href="admin-login.html" style="color: #94a3b8;">Administrator Access &rarr;</a>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // Handle URL alerts (e.g., session expired or logged out)
    const params = new URLSearchParams(window.location.search);
    const alertEl = document.getElementById("login-alert");

    if (params.get("expired")) {
      alertEl.style.display = "block";
      alertEl.style.background = "#fee2e2";
      alertEl.style.color = "#b91c1c";
      alertEl.textContent = "Your session has expired. Please log in again.";
    } else if (params.get("logged_out")) {
      alertEl.style.display = "block";
      alertEl.style.background = "#dcfce7";
      alertEl.style.color = "#15803d";
      alertEl.textContent = "You have been logged out successfully.";
    }

    // Form submission
    const pwInput = document.getElementById("password");
    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");

    form.onsubmit = async (e) => {
      e.preventDefault();
      alertEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Signing in...';

      const username = document.getElementById("username").value.trim();
      const password = pwInput.value;

      try {
        const data = await api.post("/auth/login", { name: username, password });
        
        // Save token and user details to session
        auth.saveUserSession(data.access_token, {
          name: data.name,
          account_number: data.account_number,
          last_login: data.last_login
        });

        ui.toast("Login successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 600);

      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In to Cashio Security';

        alertEl.style.display = "block";
        alertEl.style.background = "#fee2e2";
        alertEl.style.color = "#b91c1c";
        
        // Format lockout and attempt messages cleanly
        alertEl.textContent = err.message || "Invalid username or password.";
      }
    };
  </script>
</body>
</html>
